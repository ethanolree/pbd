<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyber Cipher Lock</title>
    <style>
      :root {
        --bg: #050816;
        --bg-alt: #0d1226;
        --panel: rgba(10, 18, 36, 0.78);
        --panel-strong: rgba(17, 28, 48, 0.96);
        --panel-soft: rgba(19, 34, 58, 0.75);
        --line: rgba(104, 214, 255, 0.32);
        --text: #eaf6ff;
        --muted: #9db6d2;
        --green: #6af7c6;
        --cyan: #67d6ff;
        --magenta: #ff5edb;
        --orange: #ffb454;
        --danger: #ff6a7b;
        --glow: 0 0 18px rgba(103, 214, 255, 0.5);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background:
          radial-gradient(circle at top, rgba(103, 214, 255, 0.18), transparent 25%),
          linear-gradient(120deg, var(--bg), var(--bg-alt));
        color: var(--text);
      }

      body {
        min-height: 100vh;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.25rem;
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(103, 214, 255, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(103, 214, 255, 0.06) 1px, transparent 1px);
        background-size: 28px 28px;
        mask-image: radial-gradient(circle at center, black 35%, transparent 100%);
        pointer-events: none;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background: repeating-linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.04),
          rgba(255, 255, 255, 0.04) 2px,
          transparent 2px,
          transparent 4px
        );
        opacity: 0.2;
        pointer-events: none;
      }

      .app {
        width: min(92vw, 900px);
        position: relative;
        z-index: 1;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: rgba(7, 12, 25, 0.8);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45), 0 0 36px rgba(103, 214, 255, 0.18);
        overflow: hidden;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        padding: 1rem 1.25rem;
        border-bottom: 1px solid var(--line);
        background: rgba(12, 18, 33, 0.95);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        font-size: 0.82rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--cyan);
        font-weight: 700;
      }

      .brand::before {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 12px rgba(106, 247, 198, 0.9);
        animation: pulse 1.6s infinite ease-in-out;
      }

      .shift-pill {
        background: linear-gradient(135deg, rgba(16, 83, 110, 0.92), rgba(19, 36, 56, 0.92));
        color: var(--green);
        border: 1px solid rgba(106, 247, 198, 0.5);
        padding: 0.7rem 1rem;
        border-radius: 999px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        box-shadow: var(--glow);
      }

      .cipher-panel {
        padding: 1.2rem 1.25rem 0.8rem;
        background: linear-gradient(180deg, rgba(15, 26, 44, 0.85), rgba(8, 14, 27, 0.9));
        border-bottom: 1px solid var(--line);
      }

      .cipher-label {
        color: var(--muted);
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        margin-bottom: 0.7rem;
      }

      .cipher-text {
        min-height: 4.5rem;
        display: flex;
        align-items: center;
        padding: 1rem 1.15rem;
        border: 1px solid rgba(103, 214, 255, 0.25);
        border-radius: 18px;
        background: rgba(10, 17, 32, 0.95);
        color: var(--cyan);
        font-size: clamp(1rem, 2vw, 1.35rem);
        letter-spacing: 0.08em;
        word-break: break-word;
        box-shadow: inset 0 0 18px rgba(103, 214, 255, 0.08);
      }

      .game-panel {
        padding: 1.5rem 1.25rem 1.8rem;
      }

      .status-row {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        align-items: center;
        margin-bottom: 1.1rem;
        color: var(--muted);
        font-size: 0.75rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .step-badge {
        background: rgba(103, 214, 255, 0.08);
        border: 1px solid rgba(103, 214, 255, 0.25);
        padding: 0.45rem 0.7rem;
        border-radius: 999px;
      }

      .question-card {
        display: grid;
        gap: 1rem;
        background: rgba(13, 20, 38, 0.8);
        border: 1px solid rgba(103, 214, 255, 0.22);
        border-radius: 22px;
        padding: 1.25rem;
      }

      .image-frame {
        width: min(100%, 430px);
        margin: 0 auto;
        aspect-ratio: 4 / 3;
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid rgba(255, 94, 219, 0.4);
        background: rgba(255, 255, 255, 0.02);
        box-shadow: inset 0 0 22px rgba(255, 94, 219, 0.12);
      }

      .image-frame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .prompt {
        margin: 0;
        font-size: clamp(1.2rem, 2.4vw, 1.7rem);
        line-height: 1.4;
      }

      .prompt strong {
        color: var(--orange);
      }

      form {
        display: grid;
        gap: 0.8rem;
      }

      input[type="text"],
      input[type="number"] {
        width: 100%;
        border: 1px solid rgba(103, 214, 255, 0.28);
        background: rgba(4, 9, 18, 0.9);
        color: var(--text);
        padding: 0.9rem 1rem;
        border-radius: 12px;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input:focus {
        border-color: rgba(106, 247, 198, 0.9);
        box-shadow: 0 0 0 4px rgba(106, 247, 198, 0.12);
      }

      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 0.9rem 1.2rem;
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      .primary {
        background: linear-gradient(135deg, var(--cyan), var(--green));
        color: #07131a;
        box-shadow: 0 10px 26px rgba(103, 214, 255, 0.3);
      }

      .secondary {
        background: rgba(255, 94, 219, 0.12);
        border: 1px solid rgba(255, 94, 219, 0.28);
        color: var(--magenta);
      }

      .feedback {
        min-height: 1.2rem;
        font-size: 0.92rem;
        color: var(--muted);
      }

      .feedback.error {
        display: block;
        padding: 0.8rem 0.9rem;
        border-radius: 12px;
        background: rgba(255, 106, 123, 0.12);
        border: 1px solid rgba(255, 106, 123, 0.7);
        color: #ffd4d9;
        font-weight: 700;
        letter-spacing: 0.04em;
        box-shadow: 0 0 18px rgba(255, 106, 123, 0.2);
      }

      .feedback.success {
        color: var(--green);
      }

      .title-screen {
        display: grid;
        place-items: center;
        text-align: center;
        gap: 1rem;
        min-height: 340px;
        padding: 2rem 1.25rem;
      }

      .title-screen .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.5rem 0.8rem;
        border-radius: 999px;
        border: 1px solid rgba(103, 214, 255, 0.4);
        background: rgba(103, 214, 255, 0.08);
        color: var(--cyan);
        font-size: 0.72rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .title-screen h1 {
        margin: 0;
        font-size: clamp(1.7rem, 3vw, 2.8rem);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text);
      }

      .title-screen p {
        margin: 0;
        max-width: 540px;
        color: var(--muted);
        line-height: 1.7;
        font-size: 0.96rem;
      }

      .rules-panel {
        width: min(100%, 620px);
        margin-top: 0.4rem;
        padding: 1rem 1.1rem;
        border-radius: 18px;
        border: 1px solid rgba(103, 214, 255, 0.24);
        background: rgba(8, 16, 28, 0.8);
        box-shadow: inset 0 0 18px rgba(103, 214, 255, 0.05);
      }

      .rules-panel h2 {
        margin: 0 0 0.8rem;
        font-size: 0.78rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--cyan);
      }

      .rules-panel ol {
        margin: 0;
        padding-left: 1.2rem;
        color: var(--muted);
        line-height: 1.8;
        text-align: left;
      }

      .rules-panel li + li {
        margin-top: 0.15rem;
      }

      .cta-button {
        margin-top: 0.4rem;
        min-width: min(100%, 220px);
        padding: 1rem 1.5rem;
      }

      .success-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 1.2rem 1rem 0.6rem;
      }

      .success-screen h2 {
        margin: 0.5rem 0 0.8rem;
        font-size: clamp(2rem, 4vw, 3rem);
        letter-spacing: 0.05em;
        color: var(--green);
      }

      .success-screen .final-message {
        display: block;
        margin: 0 auto 0.8rem;
        width: min(100%, 720px);
        color: var(--text);
        font-size: 1.1rem;
        letter-spacing: 0.04em;
        line-height: 1.6;
        white-space: pre-wrap;
        text-align: center;
      }

      .success-screen p {
        color: var(--muted);
        margin: 0.25rem 0;
        font-size: 1.02rem;
      }

      .success-video-wrap {
        position: relative;
        width: min(100%, 700px);
        margin: 0.8rem auto 0;
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid rgba(103, 214, 255, 0.28);
        box-shadow: 0 0 26px rgba(103, 214, 255, 0.12);
        background: rgba(0, 0, 0, 0.45);
        height: auto;
        max-height: 1000px;
        opacity: 0;
        visibility: hidden;
        transition: opacity 1.2s ease, max-height 1.2s ease, margin 1.2s ease, border-width 1.2s ease, visibility 1.2s ease;
      }

      .success-video-wrap.visible {
        opacity: 1;
        visibility: visible;
      }

      .success-video-wrap iframe {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        border: 0;
        background: #000;
      }

      .success-video-wrap.faded {
        opacity: 0;
        max-height: 0;
        margin-top: 0;
        border-width: 0;
        visibility: hidden;
      }

      .winning-image {
        display: block;
        width: min(100%, 700px);
        margin: 0 auto;
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid rgba(103, 214, 255, 0.28);
        box-shadow: 0 0 26px rgba(103, 214, 255, 0.12);
        opacity: 0;
        transform: scale(0.98);
        transition: opacity 1.2s ease, transform 1.2s ease;
        pointer-events: none;
      }

      .winning-image.visible {
        opacity: 1;
        transform: scale(1);
      }

      .winning-image img {
        display: block;
        width: 100%;
        height: auto;
      }

      .success-video-fade {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(180deg, rgba(5, 8, 22, 0) 0%, rgba(5, 8, 22, 0.2) 45%, rgba(5, 8, 22, 0.9) 100%);
        opacity: 0;
        transition: opacity 1.6s ease;
      }

      .success-video-wrap.faded .success-video-fade {
        opacity: 1;
      }

      .loader {
        color: var(--muted);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-size: 0.76rem;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.3); opacity: 1; }
      }

      @media (max-width: 640px) {
        .topbar {
          flex-direction: column;
          align-items: flex-start;
        }

        .shift-pill {
          width: 100%;
          text-align: center;
        }

        .status-row {
          flex-direction: column;
          align-items: flex-start;
        }

        .button-row {
          flex-direction: column;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">Cipher Lock</div>
        <div id="shiftDisplay" class="shift-pill">Shift: 0</div>
      </header>

      <section class="cipher-panel">
        <div class="cipher-label">Encoded Transmission</div>
        <div id="cipherText" class="cipher-text">Loading…</div>
      </section>

      <section id="gameArea" class="game-panel" aria-live="polite"></section>
    </main>

    <script>
      const state = {
        output: '',
        finalMessage: '',
        prompt: '',
        defaultInvalid: [],
        key: [],
        currentIndex: 0,
        runningTotal: 0,
        fullShift: 0,
        winning: '',
        solved: false,
        started: false,
      };

      const gameArea = document.getElementById('gameArea');
      const shiftDisplay = document.getElementById('shiftDisplay');
      const cipherText = document.getElementById('cipherText');

      function normalizeText(value) {
        return String(value ?? '').trim().toLowerCase();
      }

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function caesarShift(text, shift) {
        const normalizedShift = ((Number(shift) % 26) + 26) % 26;
        return String(text ?? '').split('').map((char) => {
          const code = char.charCodeAt(0);

          if (code >= 65 && code <= 90) {
            return String.fromCharCode(((code - 65 + normalizedShift) % 26) + 65);
          }

          if (code >= 97 && code <= 122) {
            return String.fromCharCode(((code - 97 + normalizedShift) % 26) + 97);
          }

          return char;
        }).join('');
      }

      function updateShiftDisplay() {
        shiftDisplay.textContent = `Shift: ${state.runningTotal}`;
      }

      function updateCipherPreview() {
        const shiftToUse = state.fullShift || state.runningTotal || 0;
        const encoded = state.output ? caesarShift(state.output, shiftToUse) : 'No transmission loaded';
        cipherText.textContent = encoded;
      }

      function buildQuestionMarkup(item, index) {
        const hasText = Object.prototype.hasOwnProperty.call(item, 'text');
        const isNumberQuestion = !hasText;
        const prompt = hasText
          ? `Identify the text value linked to this signal.`
          : `Enter the numeric value linked to this signal.`;

        const expectedType = hasText ? 'text' : 'number';

        return `
          <div class="status-row">
            <span class="step-badge">Question ${index + 1} / ${state.key.length}</span>
            <span>${isNumberQuestion ? 'Numeric input' : 'Text input'}</span>
          </div>

          <div class="question-card">
            <div class="image-frame">
              <img src="./img/${item.source}" alt="${item.source}" />
            </div>

            <p class="prompt"><strong>${prompt}</strong></p>

            <form id="answerForm" data-type="${expectedType}">
              <input
                id="answerInput"
                type="${hasText ? 'text' : 'number'}"
                name="answer"
                autocomplete="off"
                placeholder="${hasText ? 'Type the phrase' : 'Type the number'}"
                required
              />

              <div class="button-row">
                <button class="primary" type="submit">Submit</button>
              </div>

              <div id="feedback" class="feedback" aria-live="polite"></div>
            </form>
          </div>
        `;
      }

      function buildFinalStageMarkup() {
        return `
          <div class="status-row">
            <span class="step-badge">Final key</span>
            <span>Shift complete</span>
          </div>

          <div class="question-card">
            <p class="prompt">The shift is unlocked. Decrypt the transmission and recover the original message.</p>

            <form id="finalForm">
              <input
                id="finalInput"
                type="text"
                name="finalAnswer"
                autocomplete="off"
                placeholder="Enter the decrypted message"
                required
              />

              <div class="button-row">
                <button class="primary" type="submit">Decrypt</button>
              </div>

              <div id="feedback" class="feedback" aria-live="polite"></div>
            </form>
          </div>
        `;
      }

      function buildSuccessMarkup() {
        return `
          <div class="success-screen">
            <div class="brand">SYSTEM BREACHED</div>
            <h2>ACCESS GRANTED</h2>
            <p class="final-message">${escapeHtml(state.finalMessage || 'No final message available.')}</p>
            <p>Shift recovered: <strong>${state.runningTotal}</strong></p>

            <div class="success-video-wrap" id="successVideoWrap" aria-live="polite"></div>

            <div class="winning-image" id="winningImageWrap" aria-live="polite">
              <img src="./img/${state.winning || 'ticket.png'}" alt="Winning prize" />
            </div>
          </div>
        `;
      }

      function getPatrickErrorMessage(item) {
        const keySource = String(item?.source ?? '').trim();
        const pool = Array.isArray(item?.invalid) && item.invalid.length
          ? item.invalid
          : (Array.isArray(state.defaultInvalid) && state.defaultInvalid.length
            ? state.defaultInvalid
            : [
                'Patrick, that answer is wrong. Try again.',
                'Patrick, that signal is corrupted. Reset and retry.',
                'Patrick, the decrypt is off. Recalibrate.'
              ]);

        return pool[Math.floor(Math.random() * pool.length)];
      }

      function clearFeedback(form) {
        const feedback = form?.querySelector('#feedback');
        if (!feedback) return;
        feedback.textContent = '';
        feedback.className = 'feedback';
      }

      function renderTitleScreen() {
        const promptText = state.prompt || 'Crack the key, decode the transmission, and breach the final system before the signal fades.';

        gameArea.innerHTML = `
          <div class="title-screen">
            <div class="badge">Mission Initializing</div>
            <h1>Patricks Birthday Caesar Cipher Lock</h1>
            <p>${promptText}</p>

            <div class="rules-panel">
              <h2>How to play</h2>
              <ol>
                <li>Each clue image asks for a number or text answer based on the key data.</li>
                <li>Every correct answer adds to your running shift total.</li>
                <li>When all clues are solved, the full shift is revealed and you must decrypt the final message.</li>
                <li>Enter the original message exactly to unlock the final screen.</li>
              </ol>
            </div>

            <button id="startGameBtn" class="primary cta-button" type="button">Start Mission</button>
          </div>
        `;

        const startGameBtn = document.getElementById('startGameBtn');
        if (startGameBtn) {
          startGameBtn.addEventListener('click', () => {
            state.started = true;
            render();
          });
        }
      }

      function render() {
        updateShiftDisplay();
        updateCipherPreview();

        if (!state.started) {
          renderTitleScreen();
          return;
        }

        if (!state.key.length) {
          gameArea.innerHTML = '<div class="loader">Awaiting key data…</div>';
          return;
        }

        if (state.currentIndex < state.key.length) {
          const currentItem = state.key[state.currentIndex];
          gameArea.innerHTML = buildQuestionMarkup(currentItem, state.currentIndex);
          return;
        }

        if (!state.solved) {
          gameArea.innerHTML = buildFinalStageMarkup();
          return;
        }

        gameArea.innerHTML = buildSuccessMarkup();

        const videoWrap = document.getElementById('successVideoWrap');
        const winningImageWrap = document.getElementById('winningImageWrap');

        setTimeout(() => {
          if (!videoWrap) return;

          const iframe = document.createElement('iframe');
          iframe.id = 'successVideo';
          iframe.title = 'Success video';
          iframe.src = 'https://www.youtube-nocookie.com/embed/MFCJ6qB26YA?autoplay=1&controls=0&fs=0&rel=0&modestbranding=1&playsinline=1&start=250&end=310&iv_load_policy=3&disablekb=1';
          iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
          iframe.referrerPolicy = 'strict-origin-when-cross-origin';
          iframe.allowFullscreen = true;

          const fade = document.createElement('div');
          fade.className = 'success-video-fade';

          videoWrap.appendChild(iframe);
          videoWrap.appendChild(fade);
          videoWrap.classList.add('visible');

          iframe.addEventListener('load', () => {
            setTimeout(() => {
              videoWrap.classList.add('faded');
              setTimeout(() => {
                videoWrap.style.display = 'none';
              }, 1200);

              if (winningImageWrap) {
                setTimeout(() => {
                  winningImageWrap.classList.add('visible');
                }, 250);
              }
            }, 60000);
          }, { once: true });

          setTimeout(() => {
            videoWrap.classList.add('faded');
            setTimeout(() => {
              videoWrap.style.display = 'none';
            }, 1200);
          }, 60000);
        }, 10000);
      }

      function handleQuestionSubmit(event) {
        event.preventDefault();

        const form = event.target;
        const input = form.querySelector('input');
        const feedback = form.querySelector('#feedback');
        const currentItem = state.key[state.currentIndex];
        const type = form.dataset.type;
        const value = input.value.trim();

        if (!currentItem) {
          return;
        }

        if (type === 'text') {
          const expected = normalizeText(currentItem.text);
          const actual = normalizeText(value);

          if (actual === expected) {
            state.runningTotal += Number(currentItem.number || 0);
            state.currentIndex += 1;
            feedback.textContent = `Signal accepted. Shift total increased to ${state.runningTotal}.`;
            feedback.className = 'feedback success';
            setTimeout(() => render(), 350);
            return;
          }

          feedback.textContent = `ERROR: ${getPatrickErrorMessage(currentItem)}`;
          feedback.className = 'feedback error';
          return;
        }

        const expectedNumber = Number(currentItem.number);
        const actualNumber = Number(value);

        if (actualNumber === expectedNumber) {
          state.runningTotal += expectedNumber;
          state.currentIndex += 1;
          feedback.textContent = `Numeric key accepted. Shift total is ${state.runningTotal}.`;
          feedback.className = 'feedback success';
          setTimeout(() => render(), 350);
          return;
        }

        feedback.textContent = `ERROR: ${getPatrickErrorMessage(currentItem)}`;
        feedback.className = 'feedback error';
      }

      function handleFinalSubmit(event) {
        event.preventDefault();

        const form = event.target;
        const input = form.querySelector('input');
        const feedback = form.querySelector('#feedback');
        const answer = normalizeText(input.value);
        const expected = normalizeText(state.output);

        if (answer === expected) {
          state.solved = true;
          feedback.textContent = 'Decryption successful.';
          feedback.className = 'feedback success';
          setTimeout(() => render(), 420);
          return;
        }

        feedback.textContent = `ERROR: ${getPatrickErrorMessage({ source: 'default' })}`;
        feedback.className = 'feedback error';
      }

      let lastReferenceSnapshot = '';

      function computeFullShift(key) {
        return key.reduce((sum, item) => {
          const value = Number(item?.number ?? 0);
          return sum + (Number.isFinite(value) ? value : 0);
        }, 0);
      }

      async function loadReference() {
        try {
          const res = await fetch('./reference.json?ts=' + Date.now(), { cache: 'no-store' });
          if (!res.ok) {
            throw new Error('Reference file not found');
          }

          const data = await res.json();
          const snapshot = JSON.stringify(data);

          if (snapshot === lastReferenceSnapshot && state.key.length) {
            return;
          }

          lastReferenceSnapshot = snapshot;

          const nextKey = Array.isArray(data.key) ? data.key : [];

          state.output = data.output || '';
          state.finalMessage = data.final_message || '';
          state.prompt = data.prompt || '';
          state.defaultInvalid = Array.isArray(data.default_invalid) ? data.default_invalid : [];
          state.key = nextKey;
          state.winning = data.winning || '';
          state.currentIndex = 0;
          state.runningTotal = 0;
          state.fullShift = computeFullShift(nextKey);
          state.solved = false;
          if (!state.started) {
            renderTitleScreen();
            return;
          }
          render();
        } catch (error) {
          gameArea.innerHTML = '<div class="loader">Unable to load cipher reference.</div>';
        }
      }

      document.addEventListener('submit', (event) => {
        const form = event.target;

        if (form.id === 'answerForm') {
          handleQuestionSubmit(event);
        }

        if (form.id === 'finalForm') {
          handleFinalSubmit(event);
        }
      });

      document.addEventListener('input', (event) => {
        const form = event.target.closest('form');
        if (!form) return;
        clearFeedback(form);
      });

      loadReference();
      setInterval(loadReference, 2000);
    </script>
  </body>
</html>
